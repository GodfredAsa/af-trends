services:
  app:
    image: degreatasa/af-trends-app:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      CLIENT_DIST: /app/client-dist
      JWT_SECRET: ${JWT_SECRET:-af-trends-local-dev-secret-key}
      SEED_PASSWORD: ${SEED_PASSWORD:-trends123}
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      VYNFY_API_URL: ${VYNFY_API_URL:-https://sms.vynfy.com/api/v1/send}
      VYNFY_API_KEY: ${VYNFY_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-AF_TRENDZ}
      SMS_ADMIN_NUMBER: ${SMS_ADMIN_NUMBER:-0548670632}
      SMS_CAMPAIGN_ID: ${SMS_CAMPAIGN_ID:-spring_promo_2024}
      SMS_CUSTOMER_SEGMENT: ${SMS_CUSTOMER_SEGMENT:-premium}
    volumes:
      - af-trends-data:/app/data

volumes:
  af-trends-data:
